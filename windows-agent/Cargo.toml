[package]
name = "windows-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
# `std` is required for Rustls ServerConnection, StreamOwned, and ServerConfig::builder().
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2"
sha2 = "0.10"
subtle = "2.6"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }
